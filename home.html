<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Home — HISONLY</title>
  <meta name="theme-color" content="#7c3aed"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .hero-banner {
      background: linear-gradient(135deg, rgba(124,58,237,0.25), rgba(245,158,11,0.1));
      border: 1px solid rgba(124,58,237,0.3);
      border-radius: var(--radius-lg);
      padding: 24px 20px;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }
    .hero-banner::after {
      content: '🎵';
      position: absolute;
      right: 16px; top: 50%;
      transform: translateY(-50%);
      font-size: 4rem;
      opacity: 0.15;
    }
    .hero-greeting { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }
    .hero-name { font-family: 'Outfit', sans-serif; font-size: 1.6rem; font-weight: 800; }
    .hero-role { margin-top: 8px; }

    .next-service-card {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-purple);
    }
    .next-service-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.7; margin-bottom: 8px; }
    .next-service-date { font-family: 'Outfit', sans-serif; font-size: 1.2rem; font-weight: 700; }
    .next-service-time { font-size: 0.9rem; opacity: 0.85; margin-top: 4px; }

    .lineup-preview {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      margin-bottom: 14px;
    }
    .lineup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

<div class="page" id="home-page">
  <div class="page-header" style="padding-top:56px;">
    <div>
      <img src="hisonly.jpg" alt="HisOnly" class="brand-logo" style="max-height:36px;"/>
    </div>
    <div id="home-avatar" class="avatar" style="cursor:pointer;" onclick="window.location='profile.html'"></div>
  </div>

  <div class="container">
    <!-- Hero -->
    <div class="hero-banner">
      <div class="hero-greeting">Good to see you,</div>
      <div class="hero-name" id="hero-name">Loading…</div>
      <div class="hero-role" id="hero-role-badge"></div>
    </div>

    <!-- Next Assigned Service -->
    <div class="section-title">📅 Your Next Service</div>
    <div id="next-service-wrap"></div>

    <!-- Lineup Preview -->
    <div class="section-title" style="margin-top:20px;">🎵 This Week's Lineup</div>
    <div id="lineup-preview-wrap"></div>

    <!-- Announcements -->
    <div class="section-title" style="margin-top:20px;">📢 Announcements</div>
    <div id="announcements-wrap"></div>

    <!-- All upcoming assignments -->
    <div class="section-title" style="margin-top:20px;">🗓️ Your Schedule</div>
    <div id="assignments-wrap"></div>

    <!-- Admin quick links (Account Management) -->
    <div id="admin-section" class="hidden">
      <div class="section-title" style="margin-top:20px;">⚡ Admin Tools</div>
      <div style="margin-bottom:16px;">
        <a href="team.html" class="card" style="display:flex;align-items:center;gap:14px;text-decoration:none;padding:16px 18px;">
          <div style="font-size:1.8rem;">👥</div>
          <div>
            <div style="font-weight:700;">Manage Accounts</div>
            <div class="text-sm text-muted">Delete or remove team member accounts</div>
          </div>
          <div style="margin-left:auto;color:var(--text-dim);">›</div>
        </a>
      </div>
    </div>

    <!-- Leader tools (Scheduling & Lineup) -->
    <div id="leader-section" class="hidden" style="margin-bottom:20px;">
      <div class="section-title" style="margin-top:20px;">🎙️ Leader Tools</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
        <a href="schedule.html" class="card" style="text-align:center;text-decoration:none;padding:18px 12px;">
          <div style="font-size:1.8rem;margin-bottom:6px;">📋</div>
          <div style="font-size:0.85rem;font-weight:600;">Assign Schedule</div>
        </a>
        <a href="lineup.html" class="card" style="text-align:center;text-decoration:none;padding:18px 12px;">
          <div style="font-size:1.8rem;margin-bottom:6px;">🎵</div>
          <div style="font-size:0.85rem;font-weight:600;">Set Lineup</div>
        </a>
      </div>
    </div>
  </div>
</div>

<!-- Bottom Nav -->
<nav class="bottom-nav">
  <a href="home.html" class="nav-item active" data-nav="home">
    <span class="nav-icon">🏠</span><span class="nav-label">Home</span>
  </a>
  <a href="calendar.html" class="nav-item" data-nav="calendar">
    <span class="nav-icon">📅</span><span class="nav-label">Calendar</span>
  </a>
  <a href="lineup.html" class="nav-item" data-nav="lineup">
    <span class="nav-icon">🎵</span><span class="nav-label">Lineup</span>
  </a>
  <a href="team.html" class="nav-item" data-nav="team">
    <span class="nav-icon">👥</span><span class="nav-label">Team</span>
  </a>
  <a href="profile.html" class="nav-item" data-nav="profile">
    <span class="nav-icon">👤</span><span class="nav-label">Profile</span>
  </a>
</nav>

<script src="js/app.js"></script>
<script>
const user = requireAuth();
if (!user) throw '';

// Fill header avatar
document.getElementById('home-avatar').textContent = getInitials(user.name);

// Hero
document.getElementById('hero-name').textContent = user.name.split(' ')[0];
const rd = getRoleDisplay(user);
document.getElementById('hero-role-badge').innerHTML = `
  <span class="badge badge-purple">${rd.emoji} ${rd.label}${rd.sub ? ' · ' + rd.sub : ''}</span>
  ${user.isAdmin ? '<span class="badge badge-gold" style="margin-left:6px;">⭐ Admin</span>' : ''}
`;

// Admin/Leader sections
if (user.isAdmin) document.getElementById('admin-section').classList.remove('hidden');
if (user.isLeader || user.role === 'singer') document.getElementById('leader-section').classList.remove('hidden');

// Next Service
async function renderNextService() {
  try {
    const assignments = await getUserAssignments(user.id);
    const today = dateKey(new Date());
    const upcoming = assignments.filter(a => a.dateKey >= today);
    const wrap = document.getElementById('next-service-wrap');
    if (!upcoming.length) {
      wrap.innerHTML = `<div class="card" style="text-align:center;padding:28px 16px;">
        <div style="font-size:2rem;margin-bottom:8px;">🙏</div>
        <div class="text-sm text-muted">No upcoming assignments yet.<br>Check your availability in the Calendar!</div>
      </div>`;
      return;
    }
    const next = upcoming[0];
    const dateObj = new Date(next.dateKey.replace(/-/g, '/'));
    const dayName = dateObj.toLocaleDateString('en-US', { weekday: 'long' });
    wrap.innerHTML = `<div class="next-service-card">
      <div class="next-service-label">Next Assigned Service</div>
      <div class="next-service-date">${formatDate(next.dateKey)}</div>
      <div class="next-service-time">⏰ ${dayName} Service</div>
    </div>`;
  } catch (error) {
    console.error('Error in renderNextService:', error);
    document.getElementById('next-service-wrap').innerHTML = '';
  }
}

// Lineup Preview — shows YouTube songs + Spotify playlist
async function renderLineupPreview() {
  try {
    const assignments = await getUserAssignments(user.id);
    const today = dateKey(new Date());
    const upcoming = assignments.filter(a => a.dateKey >= today);
    const wrap = document.getElementById('lineup-preview-wrap');
    if (!upcoming.length) { wrap.innerHTML = ''; return; }
    const next = upcoming[0];
    const lineups = await DB.getLineups();
    const data = (lineups && lineups[next.dateKey] && lineups[next.dateKey].default) || null;

    const hasSongs = data && data.songs && data.songs.length > 0;
    const hasSpotify = data && data.spotifyUrl;

    if (!hasSongs && !hasSpotify) {
      wrap.innerHTML = `<div class="lineup-preview">
        <div class="lineup-header"><span class="section-title" style="margin:0;">No lineup posted yet</span></div>
        <p class="text-sm text-muted">Your worship leader hasn't posted the lineup for ${formatShortDate(next.dateKey)} yet.</p>
      </div>`;
      return;
    }

    // Helper: extract YouTube video ID
    function ytId(url) {
      try {
        const u = new URL(url);
        if (u.hostname === 'youtu.be') return u.pathname.slice(1).split('?')[0];
        if (u.hostname.includes('youtube.com')) {
          if (u.searchParams.get('v')) return u.searchParams.get('v');
          const parts = u.pathname.split('/');
          const idx = parts.findIndex(p => p === 'embed' || p === 'shorts' || p === 'v');
          if (idx !== -1) return parts[idx + 1];
        }
      } catch (e) {}
      return null;
    }

    let innerHtml = '';

    // Show up to 2 YouTube songs as small embeds
    if (hasSongs) {
      const previewSongs = data.songs.slice(0, 2);
      previewSongs.forEach((song, i) => {
        const vid = ytId(song.url);
        if (vid) {
          innerHtml += `
            <div style="margin-bottom:10px;">
              <div style="font-size:0.8rem;font-weight:700;margin-bottom:4px;color:var(--text-primary);">
                🎬 ${song.title || 'Song ' + (i+1)}
              </div>
              <div style="border-radius:8px;overflow:hidden;aspect-ratio:16/9;">
                <iframe src="https://www.youtube.com/embed/${vid}" width="100%" height="100%" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="display:block;"></iframe>
              </div>
            </div>
          `;
        } else {
          innerHtml += `<a href="${song.url}" target="_blank" style="display:block;font-size:0.85rem;margin-bottom:6px;color:var(--primary-light);">🎬 ${song.title || 'Song ' + (i+1)} ↗</a>`;
        }
      });
      if (data.songs.length > 2) {
        innerHtml += `<div class="text-xs text-muted" style="margin-top:4px;">+${data.songs.length - 2} more song${data.songs.length - 2 !== 1 ? 's' : ''}</div>`;
      }
    }

    // Show Spotify if present
    if (hasSpotify) {
      let embedUrl = data.spotifyUrl.replace('open.spotify.com/', 'open.spotify.com/embed/');
      if (embedUrl.includes('?')) embedUrl = embedUrl.split('?')[0];
      innerHtml += `
        <div style="margin-top:${hasSongs ? '10px' : '0'};">
          <div style="font-size:0.8rem;font-weight:700;margin-bottom:4px;color:var(--text-primary);">🎵 Spotify Playlist</div>
          <div style="border-radius:10px;overflow:hidden;">
            <iframe src="${embedUrl}" width="100%" height="100" frameborder="0" allowtransparency="true" allow="encrypted-media"></iframe>
          </div>
        </div>
      `;
    }

    wrap.innerHTML = `<div class="lineup-preview">
      <div class="lineup-header">
        <span style="font-weight:700;font-size:0.95rem;">${formatShortDate(next.dateKey)} — Lineup</span>
        <a href="lineup.html" class="badge badge-purple">View All</a>
      </div>
      ${innerHtml}
    </div>`;
  } catch (error) {
    console.error('Error in renderLineupPreview:', error);
    document.getElementById('lineup-preview-wrap').innerHTML = '';
  }
}


// All Assignments
async function renderAssignments() {
  try {
    const assignments = await getUserAssignments(user.id);
    const today = dateKey(new Date());
    const upcoming = assignments.filter(a => a.dateKey >= today).slice(0, 6);
    const wrap = document.getElementById('assignments-wrap');
    if (!upcoming.length) {
      wrap.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><p>No upcoming schedules assigned.</p></div>`;
      return;
    }
    wrap.innerHTML = upcoming.map(a => {
      const dateObj = new Date(a.dateKey.replace(/-/g, '/'));
      const isSun = isSunday(dateObj);
      return `<div class="sched-card ${isSun ? 'gold' : ''}">
        <div class="sched-date">${formatDate(a.dateKey)}</div>
        <div class="sched-service">⏰ ${isSun ? 'Sunday' : 'Wednesday'} Service</div>
      </div>`;
    }).join('');
  } catch (error) {
    console.error('Error in renderAssignments:', error);
    document.getElementById('assignments-wrap').innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><p>Could not load assignments.</p></div>`;
  }
}

// Announcements
async function renderAnnouncements() {
  try {
    const announcements = await getAnnouncements();
    const wrap = document.getElementById('announcements-wrap');
    
    if (!announcements || !Array.isArray(announcements) || announcements.length === 0) {
      wrap.innerHTML = `<div class="card" style="text-align:center;padding:20px 16px;">
        <div style="font-size:1.5rem;margin-bottom:8px;">📭</div>
        <div class="text-sm text-muted">No announcements yet</div>
      </div>`;
      return;
    }

    wrap.innerHTML = announcements.slice(0, 5).map(ann => {
      const author = ann.author || 'Administrator';
      const typeEmoji = {
        'general': '📢',
        'lineup': '🎵',
        'song-submission': '🎤'
      }[ann.type] || '📢';
      
      const createdDate = new Date(ann.createdAt);
      const timeAgo = getTimeAgo(createdDate);
      
      return `<div class="card" style="padding:16px 18px;margin-bottom:12px;border-left:4px solid var(--primary);">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
          <div style="font-weight:700;font-size:0.95rem;">${typeEmoji} ${ann.title}</div>
          <div class="text-xs text-muted">${timeAgo}</div>
        </div>
        <div style="font-size:0.9rem;color:var(--text-muted);margin-bottom:6px;">by ${author}</div>
        <div style="font-size:0.9rem;line-height:1.5;">${ann.content}</div>
      </div>`;
    }).join('');
  } catch (error) {
    console.error('Error in renderAnnouncements:', error);
    const wrap = document.getElementById('announcements-wrap');
    wrap.innerHTML = `<div class="card" style="text-align:center;padding:20px 16px;">
      <div style="font-size:1.5rem;margin-bottom:8px;">⚠️</div>
      <div class="text-sm text-muted">Could not load announcements</div>
    </div>`;
  }
}

// Clear cache to ensure fresh data on page load
DB._usersCache = null;
DB._availCache = null;
DB._schedulesCache = null;
DB._lineupsCache = null;
DB._announcementsCache = null;

// Helper: Format time ago
function getTimeAgo(date) {
  const now = new Date();
  const diffMs = now - date;
  const diffMins = Math.floor(diffMs / 60000);
  const diffHours = Math.floor(diffMins / 60);
  const diffDays = Math.floor(diffHours / 24);
  
  if (diffMins < 1) return 'just now';
  if (diffMins < 60) return `${diffMins}m ago`;
  if (diffHours < 24) return `${diffHours}h ago`;
  if (diffDays < 7) return `${diffDays}d ago`;
  
  return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

async function initHome() {
  try {
    await renderNextService().catch(err => {
      console.error('Error rendering next service:', err);
    });
  } catch (err) {
    console.error('Error in renderNextService:', err);
  }
  
  try {
    await renderLineupPreview().catch(err => {
      console.error('Error rendering lineup preview:', err);
    });
  } catch (err) {
    console.error('Error in renderLineupPreview:', err);
  }
  
  try {
    await renderAnnouncements().catch(err => {
      console.error('Error rendering announcements:', err);
    });
  } catch (err) {
    console.error('Error in renderAnnouncements:', err);
  }
  
  try {
    await renderAssignments().catch(err => {
      console.error('Error rendering assignments:', err);
    });
  } catch (err) {
    console.error('Error in renderAssignments:', err);
  }
}
initHome();
</script>
</body>
</html>
